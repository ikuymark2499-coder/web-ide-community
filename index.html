<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IDE Cloud - Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const { useState, useEffect } = React;
        const { Terminal, Heart, Eye, User, ArrowLeft, Copy, Code } = lucide;

        const firebaseConfig = {
            apiKey: "AIzaSyANrna15ivEKuiMbYBnHIuspe1FvcqV8zY",
            authDomain: "my-code-hub.firebaseapp.com",
            projectId: "my-code-hub",
            storageBucket: "my-code-hub.firebasestorage.app",
            messagingSenderId: "613216136098",
            appId: "1:613216136098:web:46da39b2918059d8a120fb",
            measurementId: "G-MV34NCN3X6",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'my-code-hub-v1';

        function App() {
            const [user, setUser] = useState(null);
            const [posts, setPosts] = useState([]);
            const [view, setView] = useState('feed');
            const [selectedPost, setSelectedPost] = useState(null);

            useEffect(() => {
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setPosts(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsubscribe();
            }, [user]);

            const handleLike = async (postId, e) => {
                e.stopPropagation();
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
                await updateDoc(docRef, { likes: increment(1) });
            };

            const openDetails = async (post) => {
                setSelectedPost(post);
                setView('details');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', post.id);
                await updateDoc(docRef, { views: increment(1) });
            };

            if (!user) return (
                <div className="h-screen bg-[#020617] flex flex-col items-center justify-center text-blue-400 p-8 text-center">
                    <h1 className="text-2xl font-black text-white mb-2">กรุณาล็อกอินก่อน</h1>
                    <button onClick={() => alert("กรุณากลับไปที่หน้า Editor")} className="bg-blue-600 text-white px-8 py-3 rounded-full font-bold">กลับไปหน้า Editor</button>
                </div>
            );

            return (
                <div className="h-screen w-full bg-[#020617] text-slate-300 flex flex-col overflow-hidden">
                    <header className="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-black/40">
                        <div className="flex items-center gap-3">
                            <Terminal className="text-blue-500" size={24}/>
                            <h1 className="text-xl font-black text-white tracking-tighter uppercase">Community</h1>
                        </div>
                        <div className="text-[10px] font-bold text-blue-400">{user.email}</div>
                    </header>
                    <main className="flex-1 overflow-y-auto p-4 md:p-8">
                        {view === 'feed' ? (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <h2 className="text-2xl font-bold text-white">โค้ดล่าสุดจากเพื่อนๆ</h2>
                                <div className="grid gap-4">
                                    {posts.map(post => (
                                        <div key={post.id} onClick={() => openDetails(post)} className="bg-[#0f172a] border border-slate-800 p-6 rounded-2xl hover:border-blue-500 cursor-pointer">
                                            <div className="flex justify-between mb-4">
                                                <h3 className="text-lg font-bold text-white">{post.title}</h3>
                                                <span className="text-[10px] text-slate-500 uppercase"><User size={12}/> {post.author}</span>
                                            </div>
                                            <div className="bg-black/50 p-4 rounded-xl text-[10px] text-blue-300 opacity-40 h-16 overflow-hidden relative mb-4">
                                                <pre>{post.code}</pre>
                                                <div className="absolute inset-0 bg-gradient-to-t from-[#0f172a] to-transparent"></div>
                                            </div>
                                            <div className="flex gap-4 text-xs font-bold text-slate-500">
                                                <button onClick={(e) => handleLike(post.id, e)} className="flex items-center gap-1.5 hover:text-pink-500"><Heart size={14}/> {post.likes}</button>
                                                <span className="flex items-center gap-1.5"><Eye size={14}/> {post.views}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-4xl mx-auto">
                                <button onClick={() => setView('feed')} className="flex items-center gap-2 text-slate-500 mb-6"><ArrowLeft size={18}/> Back</button>
                                <div className="bg-[#0f172a] border border-slate-800 rounded-3xl overflow-hidden">
                                    <div className="p-6 border-b border-slate-800 flex justify-between items-center">
                                        <h2 className="text-xl font-bold text-white">{selectedPost.title}</h2>
                                        <button onClick={() => {navigator.clipboard.writeText(selectedPost.code); alert("Copy แล้ว!");}} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Copy Code</button>
                                    </div>
                                    <pre className="p-8 text-sm font-mono text-blue-300 overflow-x-auto">{selectedPost.code}</pre>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
